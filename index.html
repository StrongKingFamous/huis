<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inrichtingsmodel · kies een huis</title>
<style>
:root{--bg:#f2efe9;--panel:#fbfaf7;--line:#e4ded4;--ink:#25221e;--muted:#7a7368;--acc:#2f5d50}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 20px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px;margin-bottom:18px}
h1{margin:0 0 6px;font-size:26px}
p{margin:0 0 28px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-decoration:none;color:inherit;transition:.15s}
a.card:hover{border-color:var(--acc);box-shadow:0 6px 20px rgba(47,93,80,.14);transform:translateY(-2px)}
.card b{display:block;font-size:20px;margin-bottom:6px}
.card span{color:var(--muted);font-size:14px;line-height:1.45}
.card i{display:inline-block;margin-top:16px;color:var(--acc);font-weight:600;font-style:normal;font-size:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}main{padding-top:36px}}
</style>
</head>
<body>
<main>
  <div class="logo">⌂</div>
  <h1>Inrichtingsmodel</h1>
  <p>Kies een huis om de plattegrond en het 3D-model te bekijken.</p>
  <div class="grid">
    <a class="card" href="huis1/"><b>Huis 1</b><span>Plattegrond, 3D en ons ontwerp met meubels.</span><i>Openen →</i></a>
    <a class="card" href="huis2/"><b>Huis 2</b><span>Plattegrond en 3D van drie verdiepingen met tuin en berging.</span><i>Openen →</i></a>
  </div>
</main>
</body>
</html>
