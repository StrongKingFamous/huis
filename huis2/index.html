<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huis 2 · Inrichtingsmodel</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style id="app-style">
:root{--bg:#f2efe9;--panel:#fbfaf7;--line:#e4ded4;--ink:#25221e;--muted:#7a7368;--acc:#2f5d50;--acc-soft:#e3ece7;--wall:#2f2c29;--warn:#a85a26}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:256px minmax(0,1fr) 296px;grid-template-rows:58px minmax(0,1fr);height:100vh;height:100dvh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.t1{font-weight:700;font-size:14px;white-space:nowrap}.t2{color:var(--muted);font-size:11.5px;white-space:nowrap}
.seg{display:flex;background:#ebe6dd;border-radius:9px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfc6b8}
.btn.icon{width:34px;padding:7px 0;text-align:center}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#9b2c22}
.btn.small{padding:5px 9px;font-size:12px}
.btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
#saveStatus{color:var(--muted);font-size:11.5px;max-width:170px;line-height:1.25}
#saveStatus.dirty{color:var(--warn)}
.variant{display:flex;align-items:center;gap:4px;position:relative}
.variant select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;max-width:170px}
.menu{position:absolute;top:40px;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:50;min-width:220px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:#f3efe8}
aside{background:var(--panel);overflow:auto;min-height:0}
aside.left{border-right:1px solid var(--line);display:flex;flex-direction:column}
aside.right{border-left:1px solid var(--line)}
.levels{display:flex;flex-direction:column;gap:4px;padding:12px 12px 8px}
.levels button{display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left}
.levels button:hover{background:#f1ede6}
.levels button.on{background:var(--acc-soft);border-color:#c9dbd2;font-weight:600}
.levels small{color:var(--muted);font-weight:400}
.search{padding:4px 12px 8px}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
#catalog{padding:0 8px 16px;overflow:auto}
.cat h4{margin:12px 6px 6px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.citem{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 4px 6px;cursor:pointer;text-align:center;min-height:82px}
.citem:hover{border-color:var(--acc);box-shadow:0 2px 6px rgba(47,93,80,.12)}
.citem svg{width:46px;height:38px}
.citem .cn{font-size:11.5px;line-height:1.15}
.citem .cd{font-size:10.5px;color:var(--muted)}
.stage{position:relative;overflow:hidden;min-height:0;background:#ece8e1}
svg#plan{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#plan.dragging{cursor:grabbing}
svg#plan.tool{cursor:crosshair}
#three{position:absolute;inset:0;touch-action:none}
#three canvas{display:block}
.ilabel,.rlabel,.rsub,.mlabel{pointer-events:none;font-family:'DM Sans',system-ui,sans-serif}
.rlabel{font-weight:600;fill:#3d3832}
.rsub{fill:#6f685e}
.ilabel{fill:#1f1d1a;font-weight:500}
.noev{pointer-events:none}
.ghost{opacity:.5}
.planpill{background:#25221e;color:#fff;border-radius:999px;padding:6px 6px 6px 14px;display:flex;gap:10px;align-items:center;font-size:12.5px;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.planpill .btn{background:#fff;color:#25221e;border:0;border-radius:999px;padding:5px 12px;font-weight:600}
.overlay-tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 24px);pointer-events:none}
.overlay-tl>*{pointer-events:auto}
.notice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:12px;line-height:1.4;max-width:520px;display:flex;gap:10px;align-items:flex-start}
.notice b{font-weight:600}
.notice .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.toolbar{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 200px);display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(251,250,247,.94);border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cact{display:flex;gap:6px;padding:4px 12px 8px}.cact .btn{flex:1;padding:7px 6px}
.citem{position:relative}.cimg{width:46px;height:38px;object-fit:cover;border-radius:6px}
.cdel{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;line-height:14px;cursor:pointer;color:var(--muted);display:none;padding:0}
.citem:hover .cdel{display:block}
.dz{display:flex;flex-wrap:wrap;gap:8px;border:1.5px dashed #cfc6b8;border-radius:12px;padding:10px;min-height:96px;align-items:center;background:#faf8f4}
.dz.over{border-color:var(--acc);background:var(--acc-soft)}
.dzadd{display:grid;place-items:center;min-width:120px;height:76px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);font-size:12.5px;flex:1}
.th{position:relative;width:96px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.thx{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;line-height:18px;padding:0}
.aiNote{background:var(--acc-soft);border:1px solid #c9dbd2;border-radius:9px;padding:8px 10px;font-size:12.5px;line-height:1.45;margin:0 0 8px}
.iboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ib{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;overflow:hidden;padding:0;background:#fff;cursor:pointer;font-size:11px;color:var(--muted)}
.ib img{width:100%;height:100%;object-fit:cover;display:block}.ib span{display:block;padding:6px;text-align:left;line-height:1.25}
.pimg{width:100%;max-height:180px;object-fit:cover;border-radius:9px;border:1px solid var(--line);margin-bottom:8px;display:block}
.plink{display:inline-block;margin-top:6px;color:var(--acc);font-weight:600;font-size:12.5px;text-decoration:none}
textarea.txt{resize:vertical;font-family:inherit}
.peers{display:flex;align-items:center;padding-left:6px}.peers:empty{display:none}.peer{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-6px;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}.peer img{width:100%;height:100%;object-fit:cover}.peerlab{font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}
.tbsep{width:1px;height:22px;background:var(--line);margin:0 2px}
.toolbar .lbl{color:var(--muted);font-size:11.5px;padding:0 4px}
.toolbar input[type=range]{width:120px;accent-color:var(--acc)}
.compass{position:absolute;right:12px;bottom:12px;background:rgba(251,250,247,.94);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--muted);line-height:1.45;text-align:right}
.compass b{color:var(--ink);font-weight:600}
.sec{padding:13px 15px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 9px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec h2{margin:0 0 3px;font-size:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fields.two{grid-template-columns:1fr 1fr}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
label.f input,label.f select,.txt{border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:#fff;width:100%;color:var(--ink);font-size:12.5px}
.txt{font-size:13px}
.sws{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:24px;height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--acc);outline-offset:2px}
.colorpick{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.floors{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.fl{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;cursor:pointer;font-size:11.5px;text-align:left}
.fl.on{border-color:var(--acc);background:var(--acc-soft)}
.fl i{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.1)}
.rlist{display:flex;flex-direction:column;gap:2px}
.rlist button{display:flex;justify-content:space-between;border:0;background:none;padding:6px 6px;border-radius:7px;cursor:pointer;text-align:left}
.rlist button:hover{background:#f1ede6}
.shop{font-size:12px;line-height:1.6}
.shop div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #ebe5db}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;background:#fff;margin-right:3px}
.tips{font-size:12px;line-height:1.75;color:#4d473f}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#25221e;color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(30,28,25,.35);display:grid;place-items:center;z-index:90;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:14px;padding:18px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 8px;font-size:16px}
.mbox textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.mbox .row{justify-content:flex-end;margin-top:12px}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff7ec;border:1px solid #ecc994;border-radius:10px;padding:9px 12px;z-index:20;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08);font-size:12px}
#banner[hidden]{display:none}
.tbtabs{display:none}
@media (max-width:980px){
  html,body{overflow:hidden}
  #app{display:block;position:relative;height:100vh;height:100dvh;overflow:hidden}
  header.top{position:absolute;left:0;right:0;top:0;height:54px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:0 10px;gap:6px;z-index:30;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  header.top::-webkit-scrollbar{display:none}
  header.top>*{flex:none}
  header.top .spacer{display:none}
  .brand{margin-right:0}.brand .t1,.brand .t2{display:none}
  #viewSeg{order:1}#saveBtn{order:2}.variant{order:3}#undoBtn{order:4}#redoBtn{order:5}#modeSeg{order:6}#backupBtn{order:7}#hbBtn{order:8}.peers{order:9}#saveStatus{order:10}
  .variant .menu{position:fixed;top:58px;left:10px;right:auto}
  #saveStatus{max-width:150px}
  .stage{position:absolute;left:0;right:0;top:54px;bottom:58px}
  aside.left,aside.right{position:absolute;left:0;right:0;top:54px;bottom:58px;z-index:25;display:none;overflow:auto;border:0;-webkit-overflow-scrolling:touch}
  #app[data-m="cat"] aside.left{display:flex}
  #app[data-m="props"] aside.right{display:block}
  #catalog{max-height:none;overflow:visible;flex:none}
  .cgrid{grid-template-columns:repeat(3,1fr)}
  .tbtabs{display:flex;position:absolute;left:0;right:0;bottom:0;height:58px;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tbtabs button{flex:1;border:0;background:none;font-weight:600;color:var(--muted);font-size:13px;position:relative}
  .tbtabs button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
  .tbtabs i{display:none;position:absolute;top:12px;right:calc(50% - 38px);width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .tbtabs i.on{display:block}
  .toolbar{left:8px;right:8px;bottom:8px;max-width:none;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .toolbar>*{flex:none}
  .compass{display:none}
  input,select,textarea{font-size:16px}
  .seg button,.btn{padding-top:8px;padding-bottom:8px}
  .overlay-tl{right:96px;max-width:none}
  .notice{display:none}
  #aiFab{top:10px;right:10px;padding:7px 12px}
  #aiPanel{bottom:8px}
}
#aiFab{position:absolute;right:12px;top:12px;z-index:6;display:flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#aiPanel{position:fixed;right:14px;bottom:14px;top:72px;width:min(400px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:80;display:flex;flex-direction:column;overflow:hidden}
#aiPanel .aiHead{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#aiPanel .aiHead b{flex:1;font-size:14px}
#aiLog{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.45}
.aiMsg{max-width:88%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.aiMsg.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.aiMsg.bot{align-self:flex-start;background:#f3f0ea;border-bottom-left-radius:4px}
.aiMsg.bot.err{background:#fbeee6;color:#7a3a14}
.aiMsg img{display:block;max-width:160px;max-height:120px;border-radius:8px;margin-bottom:6px}
.aiAct{font-size:11.5px;color:var(--muted);margin-top:6px;white-space:normal}
.aiAct button{margin-top:6px}
.aiTips{display:flex;flex-direction:column;gap:6px}
.aiTips button{text-align:left;white-space:normal;font-size:12.5px}
#aiForm{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
#aiForm textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;min-height:58px;max-height:140px;box-sizing:border-box}
#aiForm .row{display:flex;gap:8px;align-items:center}
#aiForm .aiThumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#aiForm .aiThumb img{width:38px;height:38px;object-fit:cover;border-radius:6px}
@media (max-width:700px){#aiPanel{top:auto;height:70vh;right:8px;left:8px;width:auto;bottom:8px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><a class="logo" href="../" title="Terug naar de keuze" style="text-decoration:none;color:#fff">⌂</a><div><div class="t1">Huis 2</div><div class="t2">inrichtingsmodel</div></div></div>
    <div class="seg" id="modeSeg"><button data-mode="furnish">Inrichten</button><button data-mode="plan">Plattegrond aanpassen</button></div>
    <div class="seg" id="viewSeg"><button data-view="2d">2D</button><button data-view="3d">3D</button></div>
    <div class="spacer"></div>
    <div class="variant">
      <select id="variantSel" title="Kies een variant"></select>
      <button class="btn icon" id="variantMenuBtn" title="Varianten beheren">⋯</button>
      <div class="menu" id="variantMenu" hidden>
        <button data-vm="copy">Kopie van deze variant maken</button>
        <button data-vm="empty">Nieuwe lege variant (alleen huis)</button>
        <button data-vm="rename">Naam wijzigen</button>
        <button data-vm="delete">Variant verwijderen</button>
      </div>
    </div>
    <button class="btn icon" id="undoBtn" title="Ongedaan maken (Ctrl+Z)">↶</button>
    <button class="btn icon" id="redoBtn" title="Opnieuw (Ctrl+Y)">↷</button>
    <button class="btn" id="backupBtn" title="Ontwerp downloaden als bestand of een bestand openen">Bestand</button>
    <button class="btn" id="hbBtn" hidden>Inloggen</button>
    <button class="btn primary" id="saveBtn">Opslaan</button>
    <div class="peers" id="peers"></div>
    <div id="saveStatus"></div>
  </header>
  <aside class="left">
    <div class="levels" id="levelTabs"></div>
    <div class="cact"><button class="btn primary small" id="btnInspo" title="Foto, screenshot of link van bijvoorbeeld een keuken inladen">＋ Foto of link</button><button class="btn small" id="btnCustom" title="Zelf een meubel of element maken">＋ Eigen element</button></div>
    <div class="search"><input id="catSearch" placeholder="Zoek meubel of element…" autocomplete="off"></div>
    <div id="catalog"></div>
  </aside>
  <main class="stage" id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"><defs id="pdefs"></defs><g id="world"></g></svg>
    <div id="three" hidden></div>
    <div class="overlay-tl"><div class="notice" id="notice" hidden></div><div class="planpill" id="planPill" hidden><span>Plattegrond aanpassen · meubels staan op de achtergrond</span><button class="btn" id="backFurnish">Terug naar inrichten</button></div></div>
    <div id="banner" hidden></div>
    <div class="toolbar" id="tb2d">
      <button class="btn icon small" data-tb="zoomout" title="Uitzoomen">−</button>
      <button class="btn icon small" data-tb="zoomin" title="Inzoomen">+</button>
      <button class="btn small" data-tb="fit" title="Alles in beeld">Passend</button>
      <button class="btn small" data-tb="measure" title="Meetlint: sleep om te meten">Meten</button>
      <button class="btn small" data-tb="snap" title="Uitlijnen op 5 cm en tegen muren">Uitlijnen</button>
      <button class="btn small" data-tb="orig" title="Originele plattegrond over het model tonen">Originele plattegrond</button>
      <span class="tbsep"></span>
      <button class="btn small" data-tb="wall" title="Sleep om een muur te tekenen">✎ Muur tekenen</button>
      <button class="btn small plan-only" data-tb="add-doorbraak" title="Stuk muur weghalen (doorbraak)">Doorbraak</button>
      <button class="btn small plan-only" data-tb="add-deur80" title="Binnendeur toevoegen">+ Deur</button>
      <button class="btn small plan-only" data-tb="add-raam" title="Raam toevoegen">+ Raam</button>
    </div>
    <div class="toolbar" id="tb3d" hidden>
      <span class="lbl">Muurhoogte</span><input type="range" id="wallH" min="20" max="100" step="5" value="100">
      <button class="btn small" data-tb3="top">Bovenaanzicht</button>
      <button class="btn small" data-tb3="persp">Schuin</button>
      <button class="btn small" data-tb3="eye">Ooghoogte</button>
      <span class="lbl" id="hint3d">Sleep = draaien · Shift/rechts slepen = schuiven · scroll = zoomen</span>

/* ---------- helpers ---------- */
let _uid=0; const uid=()=> 'u'+Date.now().toString(36)+(_uid++).toString(36)+Math.floor(Math.random()*1e4).toString(36);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
function hexToRgb(h){h=String(h||'#cccccc').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,f){const [r,g,b]=hexToRgb(h);if(f<0)return rgbToHex(r*(1+f),g*(1+f),b*(1+f));return rgbToHex(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f);}
function lum(h){const [r,g,b]=hexToRgb(h);return (0.299*r+0.587*g+0.114*b)/255;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}}
const normRot=a=>((Math.round(a)%360)+360)%360;

// update older saved designs: stairs, kitchen, garden, and add the "current state" variant
function migrate(st){
  if(!st)return st;
  if(st.mig3){cleanupStray(st);return st;}
  const fresh=makeDefault();const fv=fresh.variants[0];const ids=new Set();
  (st.variants||[]).forEach(v=>(v.levels||[]).forEach(L=>{const F=fv.levels.find(x=>x.id===L.id);if(!F)return;
    const isOld=i=>/^d\d+$/.test(String(i.id));
    // stairs
    const hadOldStairs=L.items.some(i=>i.k==='trap'&&isOld(i));
    if(hadOldStairs){L.items=L.items.filter(i=>!(i.k==='trap'&&isOld(i)));F.items.filter(i=>['stairsQ','void','railing'].includes(i.s)).forEach(i=>L.items.push(Object.assign(JSON.parse(JSON.stringify(i)),{id:'m'+i.id})));}
    if(L.id==='bg'){
      const k=L.items.find(i=>i.k==='keukenL'&&isOld(i)&&i.x===376&&i.y===731);
      if(k){L.items=L.items.filter(i=>i!==k&&!(i.k==='hoge_kast'&&isOld(i)&&i.x===262));F.items.filter(i=>i.orig&&['keukenL','bovenkast'].includes(i.k)).forEach(i=>L.items.push(Object.assign(JSON.parse(JSON.stringify(i)),{id:'m'+i.id})));}
      const gz=L.rooms.find(r=>r.name==='Gazon'&&r.x===-29&&r.y===-1096&&r.h===765),sh=L.rooms.find(r=>r.name==='Berging'&&r.x===257);
      if(gz&&sh){L.rooms=L.rooms.filter(r=>!(r===gz||r===sh||(r.name==='Terras'&&r.y===-331)));
        L.items=L.items.filter(i=>!(isOld(i)&&(i.y<-800&&(i.s==='wall'||i.n==='Deur berging')||i.k==='boom'||(i.k==='plantenbak'&&i.y===-360))));
        const outRooms=F.rooms.filter(r=>['Tuin','Kunstgras','Zijtuin','Berging'].includes(r.name)).map(r=>Object.assign(JSON.parse(JSON.stringify(r)),{id:'m'+r.id}));
        L.rooms=outRooms.filter(r=>r.kind==='outdoor').concat(L.rooms.filter(r=>r.kind==='outdoor'),outRooms.filter(r=>r.kind!=='outdoor'),L.rooms.filter(r=>r.kind!=='outdoor'));
        F.items.filter(i=>i.y<-31&&(i.s==='wall'||isOpening(i)||(i.orig&&['plantenbak','kliko'].includes(i.k)))&&!(i.s==='pui')).forEach(i=>L.items.push(Object.assign(JSON.parse(JSON.stringify(i)),{id:'m'+i.id})));}
    }
  }));
  if(!(st.variants||[]).some(v=>v.id==='var-huidig'))st.variants.push(fresh.variants[1]);
  st.mig3=true;cleanupStray(st);return st;
}

function cleanupStray(st){if(st.mig4)return;(st.variants||[]).forEach(v=>(v.levels||[]).forEach(L=>{L.items=(L.items||[]).filter(o=>{if(!OPEN.has(o.s))return true;const c=CAT[o.k];if(!c||o.n!==c.n)return true;const hz=normRot(o.rot)%180===0,cc=hz?o.y:o.x,a=hz?o.x:o.y;return L.items.some(w=>w.s==='wall'&&(normRot(w.rot)%180===0)===hz&&Math.abs((hz?w.y:w.x)-cc)<=w.d/2+10&&a>=(hz?w.x:w.y)-w.w/2-5&&a<=(hz?w.x:w.y)+w.w/2+5);});}));st.mig4=true;}

let saving=false;
async function saveShared(){
  if(HB&&ON.canWrite!==true){openLogin();return;}
  if(typeof ON!=='undefined'&&ON.on){syncNow();toast('Wordt automatisch online opgeslagen');return;}
  if(!artifactApi){toast('Opslaan in de pagina werkt hier niet. Je wijzigingen staan wel in deze browser; download ze eventueel als bestand.',5200);openFile();return;}
  if(saving)return;saving=true;updateSaveUI('Opslaan…');
  const prevAt=state.savedAt;state.savedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify({base:state.savedAt,ts:Date.now(),state}));}catch(e){}
  try{await artifactApi.publish(buildDocument(state));toast('Opgeslagen. De pagina wordt ververst.');}
  catch(err){state.savedAt=prevAt;saving=false;saveDraft();const c=(err&&(err.code||err.name||err.message))||'';
    if(/conflict/i.test(c))toast('Iemand anders heeft net opgeslagen. De pagina laadt die versie.',5000);
    else if(/not_granted|not_writer|permission/i.test(c)){toast('Je kunt deze pagina alleen bekijken. Je ontwerp staat in deze browser; kies Bestand › Download ontwerp om het te bewaren of door te sturen.',6500);openFile();}
    else toast('Opslaan lukte niet ('+esc(String(c).slice(0,60))+'). Je wijzigingen staan nog in deze browser.',5000);
    updateSaveUI();}
}
function updateSaveUI(msg){
  const st=$('#saveStatus');const dirty=isDirty();try{renderHB();}catch(e){}
  if(typeof ON!=='undefined'&&ON.db&&(ON.on||ON.err)){const sb=$('#saveBtn');sb.hidden=(ON.on&&ON.canWrite!==false)||!!HB;
    if(ON.err){st.className='dirty';st.textContent=ON.err;}
    else if(ON.on&&ON.canWrite===false){st.className='dirty';st.textContent=HB?'Alleen bekijken · log in om te bewerken':'Alleen bekijken · jouw wijzigingen blijven in deze browser';}
    else if(ON.writing||(syncT&&ON.on&&ON.canWrite!==false&&state.variants.some((v,i)=>ON.S.v[v.id]!==serVariant(v,i)))){st.className='';st.textContent='Online opslaan…';}
    else{st.className='';st.textContent='✓ Online opgeslagen'+(ON.lastAt?' '+new Date(ON.lastAt).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}):'');}
    $('#undoBtn').disabled=!undo.length;$('#redoBtn').disabled=!redo.length;return;}
  st.className=dirty?'dirty':'';
  if(msg)st.textContent=msg;
  else if(dirty)st.textContent=artifactApi?'Niet opgeslagen wijzigingen':'Wijzigingen staan in deze browser';
  else st.textContent=state.savedAt?'Opgeslagen '+new Date(state.savedAt).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Basisversie';
  $('#saveBtn').title=artifactApi?'Opslaan voor iedereen met de link':'Opslaan voor iedereen werkt op de gepubliceerde pagina';
  $('#undoBtn').disabled=!undo.length;$('#redoBtn').disabled=!redo.length;
}

function modal(html,bind){const m=$('#modal');m.innerHTML='<div class="mbox">'+html+'</div>';m.hidden=false;const close=()=>{m.hidden=true;m.innerHTML='';};m.onclick=e=>{if(e.target===m)close();};bind&&bind(m,close);return close;}
function askText(title,val,cb){modal(`<h3>${esc(title)}</h3><input class="txt" id="mIn" value="${esc(val)}"><div class="row"><button class="btn" data-x>Annuleren</button><button class="btn primary" data-ok>OK</button></div>`,(m,close)=>{const i=m.querySelector('#mIn');i.focus();i.select();const ok=()=>{const v=i.value.trim();close();if(v)cb(v);};m.querySelector('[data-ok]').onclick=ok;m.querySelector('[data-x]').onclick=close;i.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')close();};});}
function askConfirm(text,okLabel,cb){modal(`<h3>Weet je het zeker?</h3><p>${text}</p><div class="row"><button class="btn" data-x>Annuleren</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`,(m,close)=>{m.querySelector('[data-ok]').onclick=()=>{close();cb();};m.querySelector('[data-x]').onclick=close;});}
function openBackup(){
  const lean=JSON.parse(JSON.stringify(state));
  const code=JSON.stringify(lean);
  modal(`<h3>Back-up van je ontwerp</h3><p class="muted">Kopieer deze code en bewaar hem (bijvoorbeeld in een mail aan jezelf). Plak later een code hieronder om een ontwerp terug te zetten.</p>
  <textarea id="bOut" readonly>${esc(code)}</textarea><div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn small" id="bCopy">Kopieer code</button></div>
  <p class="muted" style="margin-top:14px">Ontwerp terugzetten:</p><textarea id="bIn" placeholder="Plak hier een back-upcode"></textarea>
  <div class="row"><button class="btn" data-x>Sluiten</button><button class="btn primary" id="bLoad">Terugzetten</button></div>`,(m,close)=>{
    m.querySelector('[data-x]').onclick=close;
    m.querySelector('#bCopy').onclick=async()=>{const ta=m.querySelector('#bOut');try{await navigator.clipboard.writeText(ta.value);toast('Code gekopieerd');}catch(e){ta.select();toast('Selecteer de code en kopieer met Ctrl+C');}};
    m.querySelector('#bLoad').onclick=()=>{try{const o=JSON.parse(m.querySelector('#bIn').value);if(!o||!o.variants)throw 0;const prev=snapshot();state.variants=o.variants;state.cur=o.cur||0;if(o.underlays)state.underlays=o.underlays;pushUndo(prev);markDirty();ui.sel=null;ui.level=0;close();renderAll();fitView();toast('Ontwerp teruggezet');}catch(e){toast('Dat is geen geldige back-upcode');}};
  });
}

/* ---------- 2D drawing of shapes (local coords, centered) ---------- */
function shapeSVG(it,sw){
  const w=it.w,d=it.d,c=it.c||'#ccc',st=shade(c,lum(c)>.5?-.42:.35),x0=-w/2,y0=-d/2;
  const R=(x,y,ww,hh,f,ex)=>`<rect x="${r1(x)}" y="${r1(y)}" width="${r1(Math.max(0,ww))}" height="${r1(Math.max(0,hh))}" fill="${f}" stroke="${st}" stroke-width="${sw}" ${ex||''}/>`;
  const L=(a,b,cc,dd,col,wd)=>`<line x1="${r1(a)}" y1="${r1(b)}" x2="${r1(cc)}" y2="${r1(dd)}" stroke="${col||st}" stroke-width="${wd||sw}"/>`;
  const C=(cx,cy,r,f,ex)=>`<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(Math.max(0,r))}" fill="${f}" stroke="${st}" stroke-width="${sw}" ${ex||''}/>`;
  const cc=it.c2||c;const chair=(cx,cy,flip)=>{const cw=42,cd=40;const yb=flip?cy+cd/2-6:cy-cd/2;return R(cx-cw/2,cy-cd/2,cw,cd,shade(cc,-.1),'rx="5"')+R(cx-cw/2,yb,cw,6,shade(cc,-.3),'rx="2"');};
  switch(it.s){
    case 'sofa':{const a=Math.min(18,w*.16),b=Math.min(22,d*.28);return R(x0,y0,w,d,c,'rx="7"')+R(x0,y0,w,b,shade(c,-.14),'rx="6"')+R(x0,y0+b-2,a,d-b+2,shade(c,-.08),'rx="5"')+R(w/2-a,y0+b-2,a,d-b+2,shade(c,-.08),'rx="5"')+(w>120?L(0,y0+b,0,d/2-3,shade(c,-.2)):'');}
    case 'cornersofa':{const s=Math.min(95,w*.45,d*.45),b=20;return `<path d="M${x0} ${y0} H${w/2} V${y0+s} H${x0+s} V${d/2} H${x0} Z" fill="${c}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`+R(x0,y0,w,b,shade(c,-.14),'rx="5"')+R(x0,y0,b,d,shade(c,-.14),'rx="5"')+R(w/2-16,y0+b,16,s-b,shade(c,-.08),'rx="4"')+R(x0+b,d/2-16,s-b,16,shade(c,-.08),'rx="4"');}
    case 'chair':return R(x0,y0,w,d,c,'rx="5"')+R(x0,y0,w,7,shade(c,-.3),'rx="2"');
    case 'chairRound':return C(0,4,Math.min(w,d)/2-4,c)+`<path d="M${x0+6} ${y0+10} Q0 ${y0-4} ${w/2-6} ${y0+10}" fill="none" stroke="${shade(c,-.3)}" stroke-width="${7}" stroke-linecap="round"/>`;
    case 'table':return R(x0,y0,w,d,c,'rx="3"');
    case 'roundtable':case 'pouf':return `<ellipse cx="0" cy="0" rx="${w/2}" ry="${d/2}" fill="${c}" stroke="${st}" stroke-width="${sw}"/>`;
    case 'dining':{const td=Math.max(70,d-100);let h=R(x0+4,-td/2,w-8,td,c,'rx="3"');const n=Math.max(1,Math.floor((w-10)/62));for(let i=0;i<n;i++){const cx=x0+(i+.5)*w/n;h+=chair(cx,-td/2-24,false)+chair(cx,td/2+24,true);}return h;}
    case 'ovalDining':{const td=Math.max(60,d-100),a=w/2,b=td/2;let h=`<ellipse cx="0" cy="0" rx="${a}" ry="${b}" fill="${c}" stroke="${st}" stroke-width="${sw}"/>`;const n=Math.max(2,Math.floor((w-10)/62)),sp=Math.min(60,w*.78/n);for(let i=0;i<n;i++){const cx=(i-(n-1)/2)*sp,ey=b*Math.sqrt(Math.max(0,1-(cx/a)*(cx/a)));h=chair(cx,-ey-22,false)+chair(cx,ey+22,true)+h;}return h;}
    case 'roundDining':{const r=Math.max(35,(Math.min(w,d)-100)/2);let h='';[[0,-1],[0,1],[-1,0],[1,0]].forEach(([a,b])=>{const cx=a*(r+22),cy=b*(r+22);h+=`<rect x="${cx-21}" y="${cy-20}" width="42" height="40" rx="6" fill="${shade(it.c2||c,-.15)}" stroke="${st}" stroke-width="${sw}"/>`;});return h+C(0,0,r,c);}
    case 'rug':return `<rect x="${x0}" y="${y0}" width="${w}" height="${d}" rx="4" fill="${c}" fill-opacity=".7" stroke="${shade(c,-.3)}" stroke-width="${sw}" stroke-dasharray="${6*sw} ${4*sw}"/>`;
    case 'rugRound':return `<ellipse cx="0" cy="0" rx="${w/2}" ry="${d/2}" fill="${c}" fill-opacity=".7" stroke="${shade(c,-.3)}" stroke-width="${sw}" stroke-dasharray="${6*sw} ${4*sw}"/>`;
    case 'bed':{const hb=Math.min(8,d*.05);let h=R(x0,y0,w,d,'#f6f4ef','rx="4"')+R(x0,y0+d*.32,w,d*.68,c,'rx="4"')+L(x0,y0+d*.42,w/2,y0+d*.42,shade(c,-.2))+R(x0,y0,w,hb,it.c2||shade(c,-.35),'rx="2"');const pw=w>=120?(w-24)/2:w-16;h+=R(x0+8,y0+hb+5,pw,Math.min(32,d*.16),'#fff','rx="6"');if(w>=120)h+=R(w/2-8-pw,y0+hb+5,pw,Math.min(32,d*.16),'#fff','rx="6"');return h;}
    case 'wardrobe':{let h=R(x0,y0,w,d,c,'rx="2"')+L(x0,d/2-5,w/2,d/2-5);const n=Math.max(1,Math.round(w/50));for(let i=1;i<n;i++)h+=L(x0+i*w/n,y0+3,x0+i*w/n,d/2-5);return h;}
    case 'cabinet':{let h=R(x0,y0,w,d,c,'rx="2"')+L(x0+3,d/2-4,w/2-3,d/2-4);return h;}
    case 'shelf':{let h=R(x0,y0,w,d,c,'rx="1"');const n=Math.max(1,Math.round(w/40));for(let i=1;i<n;i++)h+=L(x0+i*w/n,y0,x0+i*w/n,d/2);return h;}
    case 'tv':return R(x0,y0,w,d,c,'rx="2"')+R(-w*.4,y0+3,w*.8,5,'#1d1d1d');
    case 'counter':{const tp=it.c2||c;let h=R(x0,y0,w,d,tp,'rx="1"')+R(x0,d/2-5,w,5,c);if(w>=180){h+=R(x0+w*.18,y0+12,50,36,'#d8dcde','rx="5"');[0,1,2,3].forEach(i=>{h+=C(w*.18+(i%2)*22,y0+20+Math.floor(i/2)*20,7,'none');});}return h;}
    case 'counterL':{const t=62;let h=`<path d="M${x0} ${y0} H${w/2} V${y0+t} H${x0+t} V${d/2} H${x0} Z" fill="${it.c2||c}" stroke="${st}" stroke-width="${sw}"/><path d="M${w/2} ${y0+t-5} H${x0+t-5} V${d/2}" fill="none" stroke="${c}" stroke-width="5"/>`;h+=R(x0+t+20,y0+12,50,36,'#d8dcde','rx="5"');[0,1,2,3].forEach(i=>{h+=C(w/2-60+(i%2)*24,y0+20+Math.floor(i/2)*22,7,'none');});return h;}
    case 'fridge':return R(x0,y0,w,d,c,'rx="2"')+L(x0+4,d/2-4,w/2-4,d/2-4)+L(x0,y0,w/2,d/2,shade(st,.4))+L(w/2,y0,x0,d/2,shade(st,.4));
    case 'appliance':return R(x0,y0,w,d,c,'rx="3"')+C(0,3,Math.min(w,d)*.3,'none');
    case 'bath':return R(x0,y0,w,d,c,'rx="6"')+`<rect x="${x0+6}" y="${y0+6}" width="${w-12}" height="${d-12}" rx="${Math.min(d,w)/2-8}" fill="#e6eff2" stroke="${st}" stroke-width="${sw}"/>`;
    case 'shower':return R(x0,y0,w,d,'#eef3f4')+L(x0,y0,w/2,d/2,'#b9c6ca')+L(w/2,y0,x0,d/2,'#b9c6ca')+C(0,0,4,'#9aa');
    case 'sink':return R(x0,y0,w,d,c,'rx="3"')+`<ellipse cx="0" cy="${d*.05}" rx="${w*.3}" ry="${d*.28}" fill="#e6eff2" stroke="${st}" stroke-width="${sw}"/>`;
    case 'toilet':{const tk=Math.min(18,d*.3);return R(x0,y0,w,tk,c,'rx="3"')+`<ellipse cx="0" cy="${y0+tk+(d-tk)/2}" rx="${w/2-1}" ry="${(d-tk)/2}" fill="${c}" stroke="${st}" stroke-width="${sw}"/>`;}
    case 'plant':{const r=Math.min(w,d)/2;return C(0,0,r,'#7d9e5f')+C(-r*.35,-r*.25,r*.45,'#6b8d50')+C(r*.3,r*.2,r*.5,'#8db26c')+C(0,0,r*.25,c);}
    case 'tree':{const r=Math.min(w,d)/2;return `<circle cx="0" cy="0" r="${r}" fill="${c}" fill-opacity=".55" stroke="${shade(c,-.3)}" stroke-width="${sw}" stroke-dasharray="${5*sw} ${3*sw}"/>`+C(0,0,8,'#6b4f3a');}
    case 'lamp':return C(0,0,Math.min(w,d)/2,c)+C(0,0,Math.min(w,d)/5,shade(c,.5));
    case 'parasol':{const r=Math.min(w,d)/2;let h=`<circle cx="0" cy="0" r="${r}" fill="${c}" fill-opacity=".45" stroke="${shade(c,-.35)}" stroke-width="${sw}" stroke-dasharray="${6*sw} ${4*sw}"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;h+=L(0,0,r*Math.cos(a),r*Math.sin(a),shade(c,-.35));}return h;}
    case 'planter':return R(x0,y0,w,d,c,'rx="2"')+R(x0+5,y0+5,w-10,d-10,'#7d9e5f','rx="3"');
    case 'fence':return R(x0,y0,w,d,c);
    case 'wall':return `<rect x="${x0}" y="${y0}" width="${w}" height="${d}" fill="#2f2c29"/>`;
    case 'door':{const t=d;return `<rect x="${x0}" y="${-t/2-.5}" width="${w}" height="${t+1}" fill="#fbfaf7"/><line x1="${x0}" y1="${t/2}" x2="${x0}" y2="${t/2+w}" stroke="#3a3632" stroke-width="${sw*1.8}"/><path d="M ${w/2} ${t/2} A ${w} ${w} 0 0 1 ${x0} ${t/2+w}" fill="none" stroke="#8a8278" stroke-width="${sw}" stroke-dasharray="${4*sw} ${3*sw}"/>`;}
    case 'gap':{const t=d;return `<rect x="${x0}" y="${-t/2-1}" width="${w}" height="${t+2}" fill="#efe9df"/><rect x="${x0}" y="${-t/2-1}" width="${w}" height="${t+2}" fill="none" stroke="#b5652b" stroke-width="${sw}" stroke-dasharray="${4*sw} ${3*sw}"/>`;}
    case 'slide':{const t=d;return `<rect x="${x0}" y="${-t/2-.5}" width="${w}" height="${t+1}" fill="#fbfaf7"/>`+L(x0,-t/6,w*.1,-t/6,'#3a3632',sw*1.6)+L(-w*.1,t/6,w/2,t/6,'#3a3632',sw*1.6);}
    case 'window':case 'pui':{const t=d;let h=`<rect x="${x0}" y="${-t/2-.5}" width="${w}" height="${t+1}" fill="#eef5f8" stroke="#3a3632" stroke-width="${sw}"/>`+L(x0,0,w/2,0,'#6c8a97',sw*1.4);if(it.s==='pui'){const n=Math.max(2,Math.round(w/120));for(let i=1;i<n;i++)h+=L(x0+i*w/n,-t/2,x0+i*w/n,t/2,'#3a3632');}return h;}
    case 'stairsQ':{const ww=Math.min(w,d),start=it.wind!=='end',Px=w/2,Pz=start?d/2-ww:-d/2+ww,zfar=start?d/2:-d/2;const st2=shade(c,-.42);let h=R(x0,y0,w,d,c);
      const hit=a=>{const ca=Math.cos(a),sa=Math.sin(a);let tx=ca<-1e-6?(-w/2-Px)/ca:1e9,tz=Math.abs(sa)>1e-6?(zfar-Pz)/sa:1e9;if(tz<0)tz=1e9;const t2=Math.min(tx,tz);return [Px+ca*t2,Pz+sa*t2];};
      const a0=start?90:180;for(let k=1;k<=4;k++){const p=hit((a0+22.5*k)*Math.PI/180);h+=L(Px,Pz,p[0],p[1],st2);}
      const sl=d-ww,ns=Math.max(0,Math.round(sl/23));for(let i=1;i<ns;i++){const z=start?Pz-i*sl/ns:d/2-i*sl/ns;h+=L(x0,z,w/2,z,st2);}
      const r=w/2;if(start)h+=`<path d="M${Px-2} ${Pz+r} A ${r} ${r} 0 0 1 0 ${Pz} L0 ${y0+10} M-8 ${y0+22} L0 ${y0+10} L8 ${y0+22}" fill="none" stroke="#3a3632" stroke-width="${sw*1.6}"/>`;
      else h+=`<path d="M0 ${d/2-6} L0 ${Pz} A ${r} ${r} 0 0 1 ${Px-4} ${Pz-r} M${Px-16} ${Pz-r-8} L${Px-4} ${Pz-r} L${Px-16} ${Pz-r+8}" fill="none" stroke="#3a3632" stroke-width="${sw*1.6}"/>`;
      return h;}
    case 'void':return `<rect x="${x0}" y="${y0}" width="${w}" height="${d}" fill="#e9e4dc" stroke="#9a9286" stroke-width="${sw}" stroke-dasharray="${5*sw} ${3*sw}"/><line x1="${x0}" y1="${y0+d*.45}" x2="${x0+Math.min(w,d)*.55}" y2="${d/2}" stroke="#6f685e" stroke-width="${sw*1.3}"/>`;
    case 'railing':return `<rect x="${x0}" y="${-Math.max(d,4)/2}" width="${w}" height="${Math.max(d,4)}" fill="#ffffff" stroke="#6f685e" stroke-width="${sw}"/>`;
    case 'radiator':{let h=R(x0,y0,w,d,c,'rx="1"');const n=Math.max(2,Math.round(w/8));for(let i=1;i<n;i++)h+=L(x0+i*w/n,y0+1,x0+i*w/n,d/2-1,shade(c,-.25));return h;}
    case 'wallcab':return `<rect x="${x0}" y="${y0}" width="${w}" height="${d}" fill="${c}" fill-opacity=".55" stroke="${st}" stroke-width="${sw}" stroke-dasharray="${5*sw} ${3*sw}"/>`;
    case 'stairs':{let h=R(x0,y0,w,d,c);const n=Math.max(3,Math.round(d/22));for(let i=1;i<n;i++)h+=L(x0,y0+i*d/n,w/2,y0+i*d/n,shade(c,-.3));h+=`<path d="M0 ${d/2-12} V${y0+14} M-8 ${y0+24} L0 ${y0+12} L8 ${y0+24}" fill="none" stroke="#3a3632" stroke-width="${sw*1.6}"/>`;return h;}
    default:return R(x0,y0,w,d,c,'rx="3"');
  }
}
function patternDefs(){
  let h='';
  for(const k in FLOORS){const f=FLOORS[k];if(f.t==='flat')continue;const s=f.size;
    if(f.t==='planks'){h+=`<pattern id="pat-${k}" patternUnits="userSpaceOnUse" width="120" height="${s*2}"><rect width="120" height="${s*2}" fill="${f.c}"/><rect y="${s}" width="120" height="${s}" fill="${shade(f.c,-.04)}"/><path d="M0 ${s}H120M0 ${s*2}H120M34 0V${s}M92 ${s}V${s*2}" stroke="${f.line}" stroke-width=".8"/></pattern>`;}
    else if(f.t==='tiles'){h+=`<pattern id="pat-${k}" patternUnits="userSpaceOnUse" width="${s}" height="${s}"><rect width="${s}" height="${s}" fill="${f.c}"/><path d="M${s} 0V${s}H0" fill="none" stroke="${f.line}" stroke-width=".9"/></pattern>`;}
    else if(f.t==='herring'){h+=`<pattern id="pat-${k}" patternUnits="userSpaceOnUse" width="${s*2}" height="${s*2}"><rect width="${s*2}" height="${s*2}" fill="${f.c}"/><path d="M0 ${s}L${s} 0L${s*2} ${s}M0 ${s*2}L${s} ${s}L${s*2} ${s*2}" fill="none" stroke="${f.line}" stroke-width=".9"/></pattern>`;}
    else if(f.t==='dots'){const S=s*4;const rnd=mulberry(7);let dd='';for(let i=0;i<10;i++)dd+=`<circle cx="${r1(rnd()*S)}" cy="${r1(rnd()*S)}" r="${r1(.4+rnd()*s*.12)}" fill="${f.dot}"/>`;h+=`<pattern id="pat-${k}" patternUnits="userSpaceOnUse" width="${S}" height="${S}"><rect width="${S}" height="${S}" fill="${f.c}"/>${dd}</pattern>`;}
    else if(f.t==='grass'){const rnd=mulberry(3);let dd='';for(let i=0;i<14;i++){const x=rnd()*s,y=rnd()*s;dd+=`<path d="M${r1(x)} ${r1(y)}l${r1(rnd()*2-1)} -3" stroke="${shade(f.c,-.18)}" stroke-width=".7"/>`;}h+=`<pattern id="pat-${k}" patternUnits="userSpaceOnUse" width="${s}" height="${s}"><rect width="${s}" height="${s}" fill="${f.c}"/>${dd}</pattern>`;}
  }
  return h;
}
const floorFill=k=>{const f=FLOORS[k]||FLOORS.eiken;return f.t==='flat'?f.c:`url(#pat-${k in FLOORS?k:'eiken'})`;};

/* ---------- geometry helpers ---------- */
function roomArea(L,idx){const r=L.rooms[idx];let a=r.w*r.h;for(let j=idx+1;j<L.rooms.length;j++){const q=L.rooms[j];if((q.kind==='outdoor')!==(r.kind==='outdoor')&&r.kind!=='outdoor')continue;const ox=Math.max(0,Math.min(r.x+r.w,q.x+q.w)-Math.max(r.x,q.x)),oy=Math.max(0,Math.min(r.y+r.h,q.y+q.h)-Math.max(r.y,q.y));a-=ox*oy;}return Math.max(0,a)/10000;}
function indoorArea(L){let s=0;L.rooms.forEach((r,i)=>{if(r.kind!=='outdoor')s+=roomArea(L,i);});return s;}
function roomAt(L,x,y,indoorFirst){let hit=null;for(let i=L.rooms.length-1;i>=0;i--){const r=L.rooms[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){if(!indoorFirst||r.kind!=='outdoor')return r;if(!hit)hit=r;}}return indoorFirst?null:hit;}
function itemCorners(it){const a=it.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([u,v])=>{const lx=u*it.w/2,ly=v*it.d/2;return [it.x+lx*c-ly*s,it.y+lx*s+ly*c];});}
function bbox(L,withOutdoor){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(a,b)=>{x0=Math.min(x0,a);y0=Math.min(y0,b);x1=Math.max(x1,a);y1=Math.max(y1,b);};L.rooms.forEach(r=>{if(!withOutdoor&&(r.kind==='outdoor'||r.detached))return;add(r.x,r.y);add(r.x+r.w,r.y+r.h);});L.items.forEach(it=>{if(it.s==='wall'&&(withOutdoor||it.ext)){const fake=Object.assign({},it);itemCorners(fake).forEach(p=>add(p[0],p[1]));}});if(x0>x1){x0=0;y0=0;x1=500;y1=800;}return {x0,y0,x1,y1};}

document.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(/INPUT|TEXTAREA|SELECT/.test(tg.tagName)||tg.isContentEditable))return;if(!$('#modal').hidden)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo();return;}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSel();return;}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();if(ON.on){syncNow();toast('Wordt automatisch online opgeslagen');}else saveShared();return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return;}
  if(e.key==='Escape'){ui.wallDraft=null;ui.sel=null;ui.tool=null;ui.measure=null;ui.calib=null;renderAll();return;}
  if(e.key==='r'||e.key==='R'){rotateSel(e.shiftKey?-90:90);return;}
  if(e.key==='q'||e.key==='Q'){rotateSel(-15);return;}if(e.key==='e'||e.key==='E'){rotateSel(15);return;}
  if(ui.view==='3d'&&T3){const c=T3.cam,k=e.shiftKey?.6:.25;const fx=-Math.sin(c.theta),fz=-Math.cos(c.theta);let mv=null;const key=e.key.toLowerCase();if(key==='arrowup'||key==='w')mv=[fx,fz];else if(key==='arrowdown'||key==='s')mv=[-fx,-fz];else if(key==='arrowleft'||key==='a')mv=[fz,-fx];else if(key==='arrowright'||key==='d')mv=[-fz,fx];if(mv){e.preventDefault();c.tx+=mv[0]*k;c.tz+=mv[1]*k;draw3D();}return;}
  const st=e.shiftKey?10:1;
  if(e.key==='ArrowLeft'){e.preventDefault();nudge(-st,0);}else if(e.key==='ArrowRight'){e.preventDefault();nudge(st,0);}else if(e.key==='ArrowUp'){e.preventDefault();nudge(0,-st);}else if(e.key==='ArrowDown'){e.preventDefault();nudge(0,st);}
});

function fileToJpeg(file,max){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('Afbeelding kon niet gelezen worden'));img.onload=()=>{const sc=Math.min(1,(max||900)/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.naturalWidth*sc));cv.height=Math.max(1,Math.round(img.naturalHeight*sc));const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);const url=cv.toDataURL('image/jpeg',.82);cv.toBlob(b=>res({url,blob:b,colors:dominantColors(cv)}),'image/jpeg',.85);};img.src=rd.result;};rd.readAsDataURL(file);});}
function dataUrlToBlob(u){const [h,b]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
function dominantColors(cv){try{const s=48,c2=document.createElement('canvas');c2.width=s;c2.height=s;const g=c2.getContext('2d');g.drawImage(cv,0,0,s,s);const d=g.getImageData(0,0,s,s).data;const bins={};for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4);const b=bins[k]||(bins[k]={n:0,r:0,g:0,b:0});b.n++;b.r+=d[i];b.g+=d[i+1];b.b+=d[i+2];}
  const arr=Object.values(bins).sort((a,b)=>b.n-a.n).map(b=>[b.r/b.n,b.g/b.n,b.b/b.n]);const out=[];for(const c of arr){if(out.every(o=>Math.hypot(o[0]-c[0],o[1]-c[1],o[2]-c[2])>38))out.push(c);if(out.length>=7)break;}return out.map(c=>rgbToHex(c[0],c[1],c[2]));}catch(e){return [];}}

async function analyzeInspo(){

Omschrijving van de gebruiker: ${D.desc||'-'}

- "vorm": kies de beste sleutel uit: ${Object.keys(SHAPES).join(', ')}. Een keuken in L-vorm = counterL, een rechte keuken of kookeiland = counter, een eettafel met stoelen = dining, een ovale eettafel = ovalDining.

- "type": "meubel" of "vloer_of_wand".
- "uitleg": maximaal twee korte zinnen in het Nederlands: wat je zag en welke maten geschat zijn.

{"type":"meubel","naam":"...","vorm":"counterL","breedte_cm":280,"diepte_cm":230,"hoogte_cm":90,"kleur":"#f2f0eb","kleur2":"#b08a63","materiaal":"mat","vloer":"","muurkleur":"","uitleg":"..."}`;

    D.res=r;[r.kleur,r.kleur2].forEach(c=>{if(c&&!D.colors.includes(c))D.colors.unshift(c);});D.colors=D.colors.slice(0,10);

    if(code==='not_granted'||code==='sampling_disabled')sampleApi=null;
    if(!D.res)D.res=Object.assign(blankRes(),{kleur:D.colors[0]||'#c49a6c'});renderInspo();const st2=$('#iStatus');if(st2)st2.textContent=msg===undefined?'Analyse lukte niet. Probeer het opnieuw of vul het zelf in.':msg;}
}

function aiRules(){

  return `Je bent de inrichtingsassistent in een plattegrondmodel van het huis van een stel. Zij vertellen wat ze willen; jij voert het uit met het hulpmiddel wijzig_ontwerp en zegt daarna kort wat je deed.

Coördinaten
- Alles in cm. x loopt naar rechts, y naar beneden. Kleine y = achterkant met de tuin (west), grote y = straatkant (oost). Elke verdieping heeft dezelfde assen.
- Een element: x,y = het midden; breedte, diepte, hoogte. Bij rot 0 of 180 ligt de breedte langs x en de diepte langs y; bij 90 of 270 andersom.
- Richting: bij rot 0 zit de achterkant (rugleuning, hoofdeinde van een bed, achterkant van een kast of tv-meubel) aan de kant met de kleinste y en wijst de voorkant naar +y. rot 90: achterkant aan de rechterkant (+x). rot 180: achterkant aan de onderkant (+y). rot 270: achterkant aan de linkerkant (-x).
- Tegen een muur zetten: achterkant naar de muur; afstand van de hartlijn van de muur tot het midden van het element = muurdikte/2 + diepte/2 + 1.
- Hoekbank (cornersofa) en keuken hoekopstelling (counterL): bij rot 0 loopt het lange deel langs de achterkant over de volle breedte en het korte deel langs de linkerkant over de volle diepte. gespiegeld=true zet het korte deel rechts.
- Eettafel met stoelen (dining, ovalDining): de diepte is inclusief stoelen (tafel + 100 cm).

- Kies waar het kan een catalogussleutel; die geeft de juiste vorm. Anders een vorm uit: ${Object.keys(SHAPES).join(', ')}.
- Neem maten over die de gebruiker noemt; anders realistische maten.
- Kleuren als hex (#rrggbb). Materiaal uit: ${Object.keys(MATS).join(', ')}. Vloeren (sleutel = naam): ${Object.entries(FLOORS).map(([k,f])=>k+' = '+f.n).join('; ')}. Muurkleur als hex; bekende verfkleuren: ${PAINTS.map(p=>p[0]+' '+p[1]).join(', ')}.
- Laat muren, deuren, ramen en trappen staan; die kun je met dit hulpmiddel niet wijzigen. Elementen met [zit al in het huis] verplaats of vervang je alleen als erom gevraagd wordt.
- Laat looproutes van minstens 70 cm vrij en zet niets in de doorgang van een deur.
- Doe alle wijzigingen in één aanroep. Lees de waarschuwingen in het resultaat; staat iets buiten de ruimte, in een muur, over iets anders of voor een deur, verbeter het dan met nog één aanroep.
- "Vervang X door Y": verwijder X en zet Y op dezelfde plek, of pas X aan.
- Is iets onduidelijk, kies dan een logische plek en zeg erbij waarom. Vraag alleen terug als je echt niets zinnigs kunt doen.
- Verzin geen prijzen, merken of links.
- Je eindantwoord: Nederlands, 1 tot 3 korte zinnen, gewone tekst zonder opmaak en zonder gedachtestreepjes. Noem wat er staat en waar.

Catalogus (sleutel: naam breedte x diepte x hoogte (vorm)):
${cat.join('\n')}`;

    const seen=new Set();
    for(let i=0;i<state.variants.length;i++){const v=state.variants[i];seen.add(v.id);const s=serVariant(v,i);if(ON.S.v[v.id]===s)continue;const o=JSON.parse(s);
      if(o.j.length>250000){toast('Variant “'+esc(v.name)+'” is te groot om online op te slaan (veel foto’s?).',5000);continue;}
      await ON.db.doc('variants/'+v.id).set({name:v.name,order:i,json:o.j,at:Date.now(),by:ON.me||null});ON.S.v[v.id]=s;changed++;}
    for(const id of Object.keys(ON.S.v)){if(!seen.has(id)){await ON.db.doc('variants/'+id).delete();delete ON.S.v[id];changed++;}}
    // custom elements
    const ck=new Set();
    for(const c of state.custom){ck.add(c.k);const s=JSON.stringify(c);if(ON.S.c[c.k]===s)continue;if(s.length>250000)continue;await ON.db.doc('custom/'+c.k).set({json:s,by:ON.me||null});ON.S.c[c.k]=s;changed++;}
    for(const k of Object.keys(ON.S.c)){if(!ck.has(k)){await ON.db.doc('custom/'+k).delete();delete ON.S.c[k];changed++;}}
    // inspiration
    const ik=new Set();
    for(const x of state.inspo){ik.add(x.id);const s=JSON.stringify(x);if(ON.S.i[x.id]===s)continue;if(s.length>250000){toast('Een inspiratie-idee is te groot om online te zetten; haal er een foto uit.',4500);continue;}await ON.db.doc('inspo/'+x.id).set({json:s,ts:x.ts||Date.now(),by:ON.me||null});ON.S.i[x.id]=s;changed++;}
    for(const k of Object.keys(ON.S.i)){if(!ik.has(k)){await ON.db.doc('inspo/'+k).delete();delete ON.S.i[k];changed++;}}
    // underlays (own pasted images only when small enough)
    const ul=JSON.stringify((state.underlays||[]).map(u=>u&&u.src&&u.src.length>180000?null:u));
    if(ON.S.u!==ul){await ON.db.doc('meta/underlays').set({json:ul});ON.S.u=ul;changed++;}
    saveSyncMap();ON.err='';if(changed)ON.lastAt=Date.now();
    if(first)toast('Je ontwerp staat online. Wijzigingen worden vanaf nu automatisch opgeslagen.',4500);
  }catch(e){const c=e&&e.code;
    if(c==='invalid_argument'&&ON.canWrite!==true){ON.canWrite=false;ON.err='Je kunt hier alleen bekijken; wijzigingen blijven in deze browser.';}
    else if(c==='quota_exceeded')ON.err='De online opslag is vol. Haal wat foto’s weg.';
    else if(c==='revoked'){ON.on=false;ON.err='Je hebt geen toegang meer tot de online versie.';}
    else ON.err='Online opslaan lukte even niet; ik probeer het zo opnieuw.';
    if(c==='unavailable'||c==='resource_exhausted'||!c)setTimeout(()=>scheduleSync(),4000);
  }
  ON.writing=false;updateSaveUI();
  if(ON.again){ON.again=false;syncNow();}
}
function applyRemote(snap){
  const R=remoteList(snap);let touched=[];const byIds=new Set();
  const local=new Map(state.variants.map((v,i)=>[v.id,{v,i}]));
  R.forEach(r=>{const s=JSON.stringify({n:r.d.name,o:r.d.order||0,j:r.d.json});if(ON.S.v[r.id]===s)return;
    const l=local.get(r.id);if(l&&ON.canWrite!==false){const mine=serVariant(l.v,l.i);if(mine!==ON.S.v[r.id]&&ON.S.v[r.id])return;/* local edits pending: ours wins */}
    ON.S.v[r.id]=s;touched.push(r);if(r.d.by&&r.d.by!==ON.me)byIds.add(r.d.by);});
  const rid=new Set(R.map(r=>r.id));let removed=0;
  for(const id of Object.keys(ON.S.v)){if(!rid.has(id)){delete ON.S.v[id];removed++;}}
  if(!touched.length&&!removed)return;
  const curId=curVar()&&curVar().id;
  const next=R.map(r=>{const t=touched.find(x=>x.id===r.id);if(t)return deserVariant(r.id,r.d);const l=local.get(r.id);return l?l.v:deserVariant(r.id,r.d);});
  // keep local variants that are not online yet (being uploaded)
  state.variants.forEach(v=>{if(!rid.has(v.id)&&!ON.S.v[v.id]&&!next.some(x=>x.id===v.id))next.push(v);});
  state.variants=next;const ci=state.variants.findIndex(v=>v.id===curId);state.cur=ci>=0?ci:0;
  saveSyncMap();validateSel();saveDraft();renderAll();
  if(touched.length&&byIds.size&&ON.user){ON.user.profiles([...byIds]).then(ps=>{const n=[...byIds].map(id=>(ps[id]&&ps[id].name)||'Iemand').join(', ');toast(esc(n)+' heeft '+(touched.length===1?'“'+esc(touched[0].d.name||'een variant')+'”':'het ontwerp')+' aangepast');}).catch(()=>{});}
}
function applyQueued(){const s=ON.queued;ON.queued=false;if(s)applyRemote(s);}
function onCustom(snap){if(snap.metadata.fromCache&&!ON.on)return;let ch=false;const ids=new Set();snap.docs.forEach(d=>{if(!d.exists)return;ids.add(d.id);const s=d.data().json;if(ON.S.c[d.id]===s)return;try{const c=JSON.parse(s);const i=state.custom.findIndex(x=>x.k===c.k);if(i>=0)state.custom[i]=c;else state.custom.push(c);ON.S.c[d.id]=s;ch=true;}catch(e){}});
  if(ON.on&&!snap.metadata.fromCache){for(const k of Object.keys(ON.S.c)){if(!ids.has(k)){state.custom=state.custom.filter(c=>c.k!==k);delete ON.S.c[k];ch=true;}}}
  if(ch){saveSyncMap();saveDraft();renderCatalog();renderProps();render2D();}}
function onInspo(snap){if(snap.metadata.fromCache&&!ON.on)return;let ch=false;const ids=new Set();snap.docs.forEach(d=>{if(!d.exists)return;ids.add(d.id);const s=d.data().json;if(ON.S.i[d.id]===s)return;try{const x=JSON.parse(s);const i=state.inspo.findIndex(y=>y.id===x.id);if(i>=0)state.inspo[i]=x;else state.inspo.unshift(x);ON.S.i[d.id]=s;ch=true;}catch(e){}});
  if(ON.on&&!snap.metadata.fromCache){for(const k of Object.keys(ON.S.i)){if(!ids.has(k)){state.inspo=state.inspo.filter(x=>x.id!==k);delete ON.S.i[k];ch=true;}}}
  if(ch){state.inspo.sort((a,b)=>(b.ts||0)-(a.ts||0));saveSyncMap();saveDraft();renderProps();}}
function onUnderlays(d){if(!d.exists||!ON.on)return;const s=d.data().json;if(!s||ON.S.u===s)return;try{const arr=JSON.parse(s);state.underlays=arr.map((u,i)=>u||(state.underlays[i]&&state.underlays[i].src&&state.underlays[i].src.length>180000?state.underlays[i]:u));ON.S.u=s;saveSyncMap();saveDraft();renderAll();}catch(e){}}

/* who else is here */
function initPresence(){const room=ON.room;try{
  const push=()=>{room.presence({level:ui.level,variant:(curVar()||{}).id||'',me:ON.me||null}).catch(()=>{});};push();
  setInterval(push,4000);
  room.onPeers(ch=>{ON.peers=ch.peers.filter(p=>!p.isMe&&p.kind==='viewer');renderPeers();},()=>{});
}catch(e){}}
async function renderPeers(){const el=$('#peers');if(!el)return;const ps=ON.peers;if(!ps.length){el.innerHTML='';return;}
  const ids=ps.map(p=>p.by||(p.presence&&p.presence.me)).filter(Boolean);let prof={};try{if(ON.user&&ids.length)prof=await ON.user.profiles(ids);}catch(e){}
  const seen=new Set();el.innerHTML='';
  ps.forEach(p=>{const id=p.by||(p.presence&&p.presence.me)||p.peer;if(seen.has(id))return;seen.add(id);const pr=prof[id]||{};const lv=curVar()&&curVar().levels[p.presence&&p.presence.level];const vv=state.variants.find(v=>v.id===(p.presence&&p.presence.variant));
    const s=document.createElement('span');s.className='peer';s.title=(pr.name||'Iemand')+(lv?' kijkt naar '+lv.name:'')+(vv?' ('+vv.name+')':'');
    if(pr.avatarUrl){const im=document.createElement('img');im.src=pr.avatarUrl;im.alt='';s.appendChild(im);}else{s.textContent=(pr.name||'?').slice(0,1).toUpperCase();s.style.background=pr.color||'#2f5d50';}
    el.appendChild(s);});
  const lab=document.createElement('span');lab.className='peerlab';lab.textContent='ook hier';el.appendChild(lab);}

let onTries=0;(function waitOnline(){try{if(HB||(window.claude&&typeof window.claude.use==='function')){initOnline();return;}}catch(e){}if(onTries++<40)setTimeout(waitOnline,250);})();
/* ---------- render all ---------- */
function ensureState(){if(!state.custom)state.custom=[];if(!state.inspo)state.inspo=[];if(!state.underlays)state.underlays=[null,null,null];}
function renderAll(){
  ensureState();validateSel();
  window.__lvlH=lvl().H||248;
  renderTop();renderLevels();renderProps();
  if(ui.view==='2d')render2D();else if(T3)build3D();
}
// pending draft banner
if(pendingDraft){const bn=$('#banner');bn.hidden=false;bn.innerHTML=`<span>Er staat een niet-opgeslagen concept in deze browser van ${new Date(pendingDraft.ts).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.</span><button class="btn small" data-b="keep">Opgeslagen versie houden</button><button class="btn small primary" data-b="restore">Concept terugzetten</button>`;
  bn.onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;if(b.dataset.b==='restore'){const prev=snapshot();state=migrate(pendingDraft.state);pushUndo(prev);markDirty();}else{try{localStorage.removeItem(KEY);}catch(_){}}bn.hidden=true;ui.sel=null;renderAll();fitView();};}
renderCatalog();
renderAll();
// websiteversie: laad het gepubliceerde ontwerp (ontwerp.json) dat naast de pagina staat
function loadSiteDesign(){fetch('ontwerp.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{if(!o||!Array.isArray(o.variants))return;let base=null,hasDraft=false;try{base=localStorage.getItem(KEY+'-site');hasDraft=!!localStorage.getItem(KEY);}catch(e){}
  const stampO=String(o.exported||'');const load=()=>{migrate(o);state.variants=o.variants;state.cur=Math.min(o.cur||0,o.variants.length-1);state.custom=o.custom||[];state.inspo=o.inspo||[];if(o.underlays)state.underlays=o.underlays;savedJSON=JSON.stringify(state);undo=[];redo=[];try{localStorage.setItem(KEY+'-site',stampO);}catch(e){}ui.sel=null;renderCatalog();renderAll();fitView();};
  if(!HB||!hasDraft||!base){load();return;} // zonder eigen server is de site een kopie: altijd de online stand tonen
  if(base!==stampO){const bn=$('#banner');bn.hidden=false;bn.innerHTML=`<span>Er staat een nieuwere versie van het ontwerp online.</span><button class="btn small primary" data-b="ld">Nieuwe versie laden</button><button class="btn small" data-b="keep">Mijn versie houden</button>`;bn.onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;if(b.dataset.b==='ld')load();else{try{localStorage.setItem(KEY+'-site',stampO);}catch(_){}}bn.hidden=true;};}
}).catch(()=>{});}
if(STANDALONE&&/^https?:/.test(location.protocol)){if(HB&&!HB.failed)HB.onFail.push(()=>{ON.db=null;ON.err='';const b=$('#hbBtn');if(b)b.hidden=true;updateSaveUI();loadSiteDesign();});else loadSiteDesign();}
requestAnimationFrame(()=>fitView());
window.addEventListener('resize',()=>{if(ui.view==='2d'){if(!userView)fitBox(bbox(lvl(),false),40);render2D();}});
window.addEventListener('beforeunload',()=>{if(isDirty())saveDraft();});
})();
</script>
